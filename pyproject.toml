[project]
name = "a2a-harness"
version = "0.1.0"
description = "A zero-ops platform for A2A agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[fastapi]>=1.1.4",
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.3",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
harness = "harness_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness", "src/harness_cli"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-protobuf>=7.35.1.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
