apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harness-agent.fullname" . }}
  labels:
    {{- include "harness-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "harness-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "harness-agent.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: HARNESS_ENTRYPOINT
              value: {{ required "entrypoint is required (module:ClassName)" .Values.entrypoint | quote }}
            - name: HARNESS_PORT
              value: {{ .Values.port | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
